<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>El Juego del Ahorcado | Edición Moderna</title>
  <!-- SEO & Favicon -->
  <meta name="description" content="Juego del Ahorcado moderno, responsivo e interactivo con categorías y contador de palabras descubiertas." />
  <!-- Estilos principales -->
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>

  <!-- NAVEGACIÓN Y HEADER CON CONTADOR -->
  <header class="header">
    <div class="container header-content">
      <h1 class="app-title">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 9l6 6 6-6"></path>
          <circle cx="12" cy="12" r="10"></circle>
        </svg>
        El Ahorcado
      </h1>

      <!-- Badge de Palabras Descubiertas en LocalStorage -->
      <div class="score-badge" title="Palabras adivinadas con éxito guardadas en LocalStorage">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
        </svg>
        <span>Descubiertas: <strong id="words-guessed-count">0</strong></span>
        <button id="reset-score-btn" class="btn-icon-reset" title="Reiniciar récord">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
            <path d="M3 3v5h5"></path>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="container main-layout">

    <!-- Pestañas de Selección de Modo de Juego -->
    <nav class="mode-tabs">
      <button type="button" class="tab-btn active" id="tab-btn-category">Categorías Rápidas</button>
      <button type="button" class="tab-btn" id="tab-btn-phrase">Frase Personalizada</button>
    </nav>

    <!-- Vista Modo Categorías -->
    <section id="view-category-mode" class="mode-section">
      <div class="category-grid">
        <button type="button" class="btn-category selected" data-category="general">General</button>
        <button type="button" class="btn-category" data-category="tecnologia">Tecnología</button>
        <button type="button" class="btn-category" data-category="paises">Países</button>
        <button type="button" class="btn-category" data-category="animales">Animales</button>
      </div>
    </section>

    <!-- Vista Modo Frase Personalizada -->
    <section id="view-phrase-mode" class="mode-section d-none">
      <form id="phrase-form" class="phrase-form">
        <textarea
          id="phrase-input"
          class="textarea-styled"
          placeholder="Ingresa una frase o texto (ej: 'El conocimiento es poder'). Se elegirá una palabra al azar para adivinar."
          rows="2"
        ></textarea>
        <button type="submit" class="btn btn-accent" style="align-self: flex-end;">
          Comenzar Juego
        </button>
      </form>
    </section>

    <!-- TABLERO DEL JUEGO -->
    <section class="game-card">

      <!-- Columna SVG Ilustración del Ahorcado -->
      <div class="hangman-column">
        <div class="svg-container">
          <svg viewBox="0 0 404 579" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Estructura Horca (Siempre Visible) -->
            <rect y="456" width="143" height="123" fill="#185359" rx="8" />
            <line x1="69" y1="459" x2="69" y2="4" stroke="#0d3539" stroke-width="12" stroke-linecap="round" />
            <line x1="63" y1="6" x2="340" y2="6" stroke="#0d3539" stroke-width="12" stroke-linecap="round" />
            <line x1="339" y1="0" x2="339" y2="71" stroke="#d97736" stroke-width="8" />

            <!-- Partes del Cuerpo del Ahorcado (Animadas/Reveladas dinámicamente) -->
            <!-- 1. Cabeza -->
            <circle class="hangman-part svg-head" cx="339" cy="125" r="50" fill="#185359" stroke="#0d3539" stroke-width="6" />
            <!-- 2. Cuerpo -->
            <line class="hangman-part svg-body" x1="339" y1="175" x2="339" y2="340" stroke="#185359" stroke-width="10" stroke-linecap="round" />
            <!-- 3. Brazo Izquierdo -->
            <line class="hangman-part svg-arm-left" x1="339" y1="220" x2="275" y2="175" stroke="#185359" stroke-width="8" stroke-linecap="round" />
            <!-- 4. Brazo Derecho -->
            <line class="hangman-part svg-arm-right" x1="339" y1="220" x2="403" y2="175" stroke="#185359" stroke-width="8" stroke-linecap="round" />
            <!-- 5. Pierna Izquierda -->
            <line class="hangman-part svg-leg-left" x1="339" y1="335" x2="285" y2="430" stroke="#185359" stroke-width="8" stroke-linecap="round" />
            <!-- 6. Pierna Derecha -->
            <line class="hangman-part svg-leg-right" x1="339" y1="335" x2="393" y2="430" stroke="#185359" stroke-width="8" stroke-linecap="round" />
          </svg>
        </div>
      </div>

      <!-- Columna Principal de Juego -->
      <div class="play-column">

        <!-- Barra de Información de Intentos -->
        <div class="game-info-bar">
          <span class="badge-category" id="category-badge">General</span>
          
          <div class="attempts-container">
            <span>Intentos: <strong id="attempts-count">6</strong>/6</span>
            <div class="progress-bar-bg">
              <div class="progress-bar-fill" id="attempts-progress-bar"></div>
            </div>
          </div>
        </div>

        <!-- Espacio para la Palabra a Adivinar -->
        <div class="word-display" id="word-display">
          <!-- Generado dinámicamente desde app.js -->
        </div>

        <!-- Teclado Virtual Interactivo -->
        <div class="keyboard-display" id="keyboard-display">
          <!-- Generado dinámicamente desde app.js -->
        </div>

      </div>

    </section>

  </main>

  <!-- MODAL DE RESULTADOS (Ganado / Perdido) -->
  <div class="modal-overlay" id="result-modal">
    <div class="modal-card">
      <h2 class="modal-title" id="modal-title">¡Resultado!</h2>
      <p class="modal-word" id="modal-word">La palabra era: <span>---</span></p>
      <p id="modal-message">Detalles del resultado...</p>
      <button type="button" class="btn btn-primary" id="modal-action-btn">Continuar</button>
    </div>
  </div>

  <!-- Carga del Controlador Principal ES6 -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
